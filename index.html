<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f3d2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Scopa — the classic Italian card game. Play the computer or a friend by link." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
    <title>Scopa</title>
    <style>
      #splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,#186b45 0%,#0e4c30 45%,#041910 100%);color:#f3c34f;font-family:Cinzel,Georgia,serif;transition:opacity .4s ease}
      #splash img{width:min(32vmin,160px);height:auto;border-radius:22%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
      #splash span{font-size:clamp(28px,6vmin,44px);font-weight:800;letter-spacing:.12em}
      #splash.hide{opacity:0;pointer-events:none}
      #intro{position:fixed;inset:0;z-index:999;background:#041910;display:none;align-items:center;justify-content:center}
      #intro.on{display:flex}
      #intro video{width:100%;height:100%;object-fit:contain}
      #intro button{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fbf6ec;font:600 15px system-ui,sans-serif;cursor:pointer}
    </style>
  </head>
  <body>
    <div id="splash"><img src="/icon-192.png" alt="" /><span>SCOPA</span></div>
    <div id="intro"><video src="/intro.mp4" playsinline muted preload="auto"></video><button type="button">Skip ›</button></div>
    <div id="app"></div>
    <div class="rotate-msg" aria-hidden="true"><span>📱↻</span></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
